<template>
    <div class="scenario-runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Scenario Title & Persona Header -->
            <div class="scenario-header">
                <div class="scenario-meta">
                    <span class="drill-tag">Scenario Drill</span>
                    <span class="step-counter">Move {currentMoveNumber} of {totalMoves}</span>
                </div>
                <h2 class="drill-title">{drillTitle}</h2>
                <p class="drill-domain">{drillDomain}</p>
            </div>

            <!-- Sticky Dual-Meter Dashboard (Twin Architectural Gauges) -->
            <div class="meters-dashboard">
                <div class="meters-grid">
                    <!-- Stakeholder Trust Meter -->
                    <div class="meter-column">
                        <div class="meter-header-row">
                            <span class="meter-label">Stakeholder Trust</span>
                            <span class="meter-score">{trustScore}/100</span>
                        </div>
                        <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={trustScore}>
                            <div class="meter-fill meter-fill_trust" style={trustBarStyle}></div>
                        </div>
                        <span class="meter-status-note">{trustStatusNote}</span>
                    </div>

                    <!-- Well-Architected Integrity Meter -->
                    <div class="meter-column">
                        <div class="meter-header-row">
                            <span class="meter-label">Well-Architected Integrity</span>
                            <span class="meter-score">{integrityScore}/100</span>
                        </div>
                        <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={integrityScore}>
                            <div class="meter-fill meter-fill_integrity" style={integrityBarStyle}></div>
                        </div>
                        <span class="meter-status-note">{integrityStatusNote}</span>
                    </div>
                </div>
            </div>

            <!-- Stakeholder Dialogue Bubble (Editorial Quote in Cardo Serif) -->
            <div class="persona-dialogue-card">
                <div class="persona-header">
                    <span class="persona-avatar">{personaAvatar}</span>
                    <div class="persona-meta">
                        <span class="persona-name">{personaName}</span>
                        <span class="persona-title">{personaRole}</span>
                    </div>
                </div>
                <div class="speech-bubble">
                    <p class="dialogue-text">“{currentMove.stakeholderDialogue}”</p>
                </div>
            </div>

            <!-- Stance Options Selection -->
            <div class="stances-container" role="radiogroup" aria-label="Architectural Stances">
                <template for:each={formattedStances} for:item="stance">
                    <div
                        key={stance.id}
                        class={stance.cardClass}
                        data-id={stance.id}
                        onclick={handleSelectStance}
                        role="radio"
                        aria-checked={stance.isSelected}
                        tabindex="0"
                        onkeydown={handleKeyDown}>
                        <div class="stance-header-row">
                            <span class="stance-marker">{stance.letter}</span>
                            <span class="stance-label">{stance.label}</span>
                        </div>
                        <template if:true={isMoveAnswered}>
                            <div class="stance-deltas">
                                <span class={stance.trustDeltaClass}>Trust: {stance.trustDeltaText}</span>
                                <span class={stance.integrityDeltaClass}>Integrity: {stance.integrityDeltaText}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Move Feedback Reveal -->
            <template if:true={isMoveAnswered}>
                <div class={moveFeedbackClass} role="alert">
                    <div class="feedback-header">
                        <span class="feedback-badge">{moveFeedbackTitle}</span>
                        <span class="feedback-points">{movePointsLabel}</span>
                    </div>
                    <p class="stakeholder-reaction">
                        <span class="font-bold">{personaName}'s Reaction:</span> “{lastReactionText}”
                    </p>
                    <p class="feedback-rationale">{lastRationaleText}</p>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Canonical 40px Pill Submit -->
            <div class="controls-panel">
                <div class="controls-row">
                    <div class="controls-gate">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isMoveAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="controls-action">
                        <template if:false={isMoveAnswered}>
                            <button
                                type="button"
                                class="sh-commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitStance}>
                                Commit Stance
                            </button>
                        </template>
                        <template if:true={isMoveAnswered}>
                            <button
                                type="button"
                                class="sh-next-btn"
                                onclick={handleNextMove}>
                                {nextButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Debrief: Technical Debt Hangover Card (Architectural Audit Report) -->
        <template if:true={isComplete}>
            <div class="summary-container">
                <div class="summary-header">
                    <div class="summary-streak-badge">
                        🔥 <span class="font-bold">{streakDays}</span> Day Streak Achieved
                    </div>
                    <h2 class="summary-title">Scenario Debrief & Hangover Report</h2>
                </div>

                <!-- Dual Meter Final State -->
                <div class="final-meters-box">
                    <div class="final-meters-row">
                        <div class="final-meter-cell">
                            <span class="final-meter-label">Final Stakeholder Trust</span>
                            <span class="final-meter-value">{trustScore}/100</span>
                        </div>
                        <div class="final-meter-cell">
                            <span class="final-meter-label">Final Platform Integrity</span>
                            <span class="final-meter-value">{integrityScore}/100</span>
                        </div>
                    </div>
                </div>

                <!-- Technical Debt Hangover Card -->
                <div class={hangoverCardClass}>
                    <div class="hangover-badge-row">
                        <span class="hangover-badge">{hangoverTitle}</span>
                    </div>
                    <p class="hangover-timeline font-bold">🗓️ 6 to 12 Months Post-Deployment:</p>
                    <p class="hangover-body">{hangoverDescription}</p>
                </div>

                <!-- Stats Grid (0px Rectilinear Cells) -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-number">{correctCount}/{totalMoves}</span>
                        <span class="stat-label">Well-Architected Moves</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Calibration</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button (40px Pill) -->
                <div class="restart-wrapper">
                    <button type="button" class="sh-restart-btn" onclick={handleRestart}>
                        Re-Negotiate Scenario
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>

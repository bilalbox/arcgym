<template>
    <div class="card-wrapper">
        <!-- Decision Prompt Box (0px radius, 1px solid #000000, parchment fill) -->
        <div class="prompt-box">
            <p class="prompt-text">{prompt}</p>
        </div>

        <!-- Options List -->
        <div class="options-group" role="radiogroup" aria-label="Architectural Trade-Off Options">
            <template for:each={formattedOptions} for:item="opt">
                <div
                    key={opt.id}
                    class={opt.cardClass}
                    data-id={opt.id}
                    onclick={handleSelectOption}
                    role="radio"
                    aria-checked={opt.isSelected}
                    tabindex="0"
                    onkeydown={handleKeyDown}>
                    <div class="option-row">
                        <span class="option-marker">{opt.letter}</span>
                        <span class="option-label">{opt.label}</span>
                    </div>
                </div>
            </template>
        </div>
    </div>
</template>

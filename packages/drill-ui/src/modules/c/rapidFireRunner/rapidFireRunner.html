<template>
    <div class="runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Progress Header -->
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                <div>
                    <span class="step-indicator">DECISION {currentStepNumber} OF {totalSteps}</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style={progressBarStyle}></div>
                </div>
            </div>

            <!-- Decision Prompt and Options -->
            <c-rapid-fire-card
                prompt={currentStep.prompt}
                options={currentStep.options}
                selected-option-id={selectedOptionId}
                is-answered={isAnswered}
                onoptionselect={handleOptionSelected}>
            </c-rapid-fire-card>

            <!-- Feedback Reveal (After Commit) -->
            <template if:true={isAnswered}>
                <div class={feedbackBannerClass} role="alert">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="feedback-badge">{feedbackTitle}</span>
                        <span class="feedback-points slds-m-left_small">{lastBrierPointsLabel}</span>
                    </div>
                    <p class="feedback-rationale">{currentStepRationale}</p>
                    <template if:true={currentStepCitation}>
                        <a href={currentStepCitation} target="_blank" rel="noopener noreferrer" class="feedback-link slds-m-top_xx-small">
                            Read official guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Action Buttons -->
            <div class="controls-container slds-border_top slds-p-top_small slds-m-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-size_1-of-1 slds-medium-size_2-of-3">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <template if:false={isAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitDecision}>
                                Commit Decision
                            </button>
                        </template>
                        <template if:true={isAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand next-btn"
                                onclick={handleNextStep}>
                                {nextButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Drill Summary View -->
        <template if:true={isComplete}>
            <div class="summary-card slds-p-around_large slds-text-align_center">
                <div class="summary-streak-badge slds-m-bottom_medium">
                    🔥 <span class="font-weight-bold">{streakDays}</span> Day Streak Achieved!
                </div>
                <h2 class="slds-text-heading_large font-weight-bold slds-m-bottom_x-small">Drill Complete!</h2>
                <p class="slds-text-color_weak slds-m-bottom_large">
                    Showing up is a win. You just practiced high-stakes Salesforce architectural judgment.
                </p>

                <!-- Stats Grid -->
                <div class="slds-grid slds-wrap stats-grid slds-m-bottom_large">
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{correctCount}/{totalSteps}</span>
                        <span class="stat-label">Accuracy</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Points</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRestart}>
                    Practice Another Drill
                </button>
            </div>
        </template>
    </div>
</template>

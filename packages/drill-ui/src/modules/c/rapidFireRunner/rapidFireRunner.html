<template>
    <div class="runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Progress Header (Architectural hairline bar) -->
            <div class="progress-header">
                <div>
                    <span class="step-indicator">Decision {currentStepNumber} of {totalSteps}</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style={progressBarStyle}></div>
                </div>
            </div>

            <!-- Decision Prompt and Options -->
            <c-rapid-fire-card
                prompt={currentStep.prompt}
                options={currentStep.options}
                selected-option-id={selectedOptionId}
                is-answered={isAnswered}
                onoptionselect={handleOptionSelected}>
            </c-rapid-fire-card>

            <!-- Feedback Reveal (After Commit: 0px sharp debrief block) -->
            <template if:true={isAnswered}>
                <div class={feedbackBannerClass} role="alert">
                    <div class="feedback-header">
                        <span class="feedback-badge">{feedbackTitle}</span>
                        <span class="feedback-points">{lastBrierPointsLabel}</span>
                    </div>
                    <p class="feedback-rationale">{currentStepRationale}</p>
                    <template if:true={currentStepCitation}>
                        <a href={currentStepCitation} target="_blank" rel="noopener noreferrer" class="feedback-link">
                            Read official guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Canonical 40px Pill Action Buttons -->
            <div class="controls-container">
                <div class="controls-row">
                    <div class="controls-gate">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="controls-action">
                        <template if:false={isAnswered}>
                            <button
                                type="button"
                                class="sh-commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitDecision}>
                                Commit Decision
                            </button>
                        </template>
                        <template if:true={isAnswered}>
                            <button
                                type="button"
                                class="sh-next-btn"
                                onclick={handleNextStep}>
                                {nextButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Drill Summary View (Cardo Display, 0px cells, 40px pill CTA) -->
        <template if:true={isComplete}>
            <div class="summary-container">
                <div class="summary-streak-badge">
                    🔥 <span class="font-bold">{streakDays}</span> Day Streak Achieved
                </div>
                <h2 class="summary-title">Drill Complete.</h2>
                <p class="summary-subhead">
                    Calibrated architectural practice under high-stakes Salesforce Well-Architected governance.
                </p>

                <!-- Stats Grid (0px Rectilinear Cells) -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-number">{correctCount}/{totalSteps}</span>
                        <span class="stat-label">Accuracy</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Calibration</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="button" class="sh-restart-btn" onclick={handleRestart}>
                    Practice Another Drill
                </button>
            </div>
        </template>
    </div>
</template>

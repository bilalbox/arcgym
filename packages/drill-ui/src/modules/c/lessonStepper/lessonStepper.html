<template>
    <div class="lesson-stepper-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Lesson Header & Progress Indicator -->
            <div class="lesson-header">
                <div class="lesson-meta">
                    <span class="lesson-tag">Lesson Drill</span>
                    <span class="stage-indicator">Stage {currentStageNumber} of {totalStages}</span>
                </div>
                <h2 class="lesson-title">{lessonTitle}</h2>
                <p class="lesson-domain">{lessonDomain}</p>

                <!-- Stage Step Wizard (Architectural Stepped Index) -->
                <div class="stages-wizard">
                    <template for:each={formattedStages} for:item="stg">
                        <div key={stg.id} class={stg.wizardStepClass}>
                            <span class="wizard-step-circle">{stg.stepNumber}</span>
                            <span class="wizard-step-title">{stg.title}</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Stage Context & Code/Diagram Inspection Box (0px sharp architectural card) -->
            <div class="inspection-card">
                <div class="inspection-header">
                    <span class="inspection-badge">{currentStage.stageName}</span>
                    <span class="pillar-badge">{currentStage.focusPillar}</span>
                </div>
                <h3 class="inspection-title">{currentStage.prompt}</h3>
                
                <template if:true={currentStage.codeSnippet}>
                    <pre class="code-preview"><code>{currentStage.codeSnippet}</code></pre>
                </template>
            </div>

            <!-- Architectural Options List -->
            <div class="options-container" role="radiogroup" aria-label="Refactoring Options">
                <template for:each={formattedOptions} for:item="opt">
                    <div
                        key={opt.id}
                        class={opt.cardClass}
                        data-id={opt.id}
                        onclick={handleSelectOption}
                        role="radio"
                        aria-checked={opt.isSelected}
                        tabindex="0"
                        onkeydown={handleKeyDown}>
                        <div class="option-row">
                            <span class="option-marker">{opt.letter}</span>
                            <span class="option-label">{opt.label}</span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- In-Flight Coaching Feedback Callout (Parchment debrief banner) -->
            <template if:true={showCoachingAlert}>
                <div class="coaching-banner" role="alert">
                    <div class="coaching-header">
                        <span class="coaching-icon">💡</span>
                        <span class="coaching-title">Architectural Coaching Note</span>
                    </div>
                    <p class="coaching-text">{coachingMessage}</p>
                    <p class="coaching-subtext">Review the Well-Architected boundary and select another target pattern.</p>
                </div>
            </template>

            <!-- Success Stage Feedback Reveal -->
            <template if:true={isStageSuccess}>
                <div class="stage-success-banner" role="alert">
                    <div class="success-header">
                        <span class="success-badge">✓ Target Architectural Pattern Validated</span>
                        <span class="success-points">{stagePointsLabel}</span>
                    </div>
                    <p class="success-rationale">{currentStage.successRationale}</p>
                    <template if:true={currentStage.citationUrl}>
                        <a href={currentStage.citationUrl} target="_blank" rel="noopener noreferrer" class="citation-link">
                            Read official guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Canonical 40px Pill Submit -->
            <div class="controls-panel">
                <div class="controls-row">
                    <div class="controls-gate">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isStageSuccess}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="controls-action">
                        <template if:false={isStageSuccess}>
                            <button
                                type="button"
                                class="sh-submit-btn"
                                disabled={isSubmitDisabled}
                                onclick={handleSubmitStageDecision}>
                                Verify Stage
                            </button>
                        </template>
                        <template if:true={isStageSuccess}>
                            <button
                                type="button"
                                class="sh-next-stage-btn"
                                onclick={handleNextStage}>
                                {nextStageButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Refactor Summary View (Cardo Display, 0px cells) -->
        <template if:true={isComplete}>
            <div class="summary-container">
                <div class="summary-streak-badge">
                    🔥 <span class="font-bold">{streakDays}</span> Day Streak Achieved
                </div>
                <h2 class="summary-title">Refactoring Masterclass Complete.</h2>
                <p class="summary-subhead">
                    Systematic root cause diagnosis, decoupled Well-Architected target patterns, and governed observability.
                </p>

                <!-- Stats Grid (0px Rectilinear Cells) -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-number">4/4 Stages</span>
                        <span class="stat-label">Refactor Phases</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Calibration</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button (40px Pill) -->
                <button type="button" class="sh-restart-btn" onclick={handleRestart}>
                    Practice Another Refactor Drill
                </button>
            </div>
        </template>
    </div>
</template>

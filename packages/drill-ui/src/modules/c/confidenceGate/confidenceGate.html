<template>
    <div class="confidence-gate">
        <label class="gate-label">
            Confidence Calibration • Select Conviction Anchor
        </label>
        <div class="chip-container" role="group" aria-label="Confidence Calibration Selection">
            <template for:each={anchors} for:item="anchor">
                <button
                    key={anchor.value}
                    type="button"
                    class={anchor.cssClass}
                    data-value={anchor.value}
                    aria-pressed={anchor.isSelected}
                    disabled={disabled}
                    onclick={handleSelectAnchor}
                    title={anchor.tooltip}>
                    <span class="chip-percent">{anchor.percentLabel}</span>
                    <span class="chip-title">{anchor.title}</span>
                </button>
            </template>
        </div>
    </div>
</template>

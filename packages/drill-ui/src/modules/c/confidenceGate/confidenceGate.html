<template>
    <div class="confidence-gate slds-p-vertical_small">
        <label class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small gate-label">
            Say how sure you are (Confidence Calibration):
        </label>
        <div class="slds-grid slds-wrap chip-container slds-m-top_xx-small" role="group" aria-label="Confidence Calibration Selection">
            <template for:each={anchors} for:item="anchor">
                <button
                    key={anchor.value}
                    type="button"
                    class={anchor.cssClass}
                    data-value={anchor.value}
                    aria-pressed={anchor.isSelected}
                    disabled={disabled}
                    onclick={handleSelectAnchor}
                    title={anchor.tooltip}>
                    <span class="chip-percent">{anchor.percentLabel}</span>
                    <span class="chip-title">{anchor.title}</span>
                </button>
            </template>
        </div>
    </div>
</template>

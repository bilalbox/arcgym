<template>
    <div class="currency-runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Scenario Header -->
            <div class="scenario-header slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <span class="drill-tag slds-badge slds-theme_inverse">CURRENCY DRILL</span>
                    <span class="slds-text-body_small slds-text-color_weak">{drillDomain}</span>
                </div>
                <h2 class="slds-text-heading_medium font-weight-bold slds-m-bottom_x-small">{drillTitle}</h2>
                <p class="scenario-prompt slds-text-color_weak">{scenarioPrompt}</p>
            </div>

            <!-- Sticky Budget Meter -->
            <div class="meter-sticky-wrapper slds-m-bottom_large">
                <c-budget-meter
                    total-budget={totalBudget}
                    used-budget={totalAllocatedCost}
                    unit-label={unitLabel}
                    title={budgetTitle}>
                </c-budget-meter>
            </div>

            <!-- Configuration Categories -->
            <div class="categories-container slds-m-bottom_large">
                <template for:each={formattedCategories} for:item="cat">
                    <div key={cat.id} class="category-card slds-box slds-box_small slds-m-bottom_medium">
                        <div class="category-header slds-m-bottom_small">
                            <h3 class="category-title font-weight-bold">{cat.title}</h3>
                            <p class="category-description slds-text-body_small slds-text-color_weak">{cat.description}</p>
                        </div>

                        <!-- Option Cards -->
                        <div class="options-grid" role="radiogroup" aria-label={cat.title}>
                            <template for:each={cat.options} for:item="opt">
                                <div
                                    key={opt.id}
                                    class={opt.cardClass}
                                    data-category-id={cat.id}
                                    data-option-id={opt.id}
                                    onclick={handleSelectOption}
                                    role="radio"
                                    aria-checked={opt.isSelected}
                                    tabindex="0"
                                    onkeydown={handleKeyDown}>
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <span class="option-marker">{opt.letter}</span>
                                            <span class="option-name font-weight-bold">{opt.name}</span>
                                        </div>
                                        <span class={opt.costBadgeClass}>{opt.cost} {unitLabel}</span>
                                    </div>
                                    <p class="option-details">{opt.details}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Post-Commit Evaluation Reveal -->
            <template if:true={isAnswered}>
                <div class={feedbackClass} role="alert">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="feedback-badge">{feedbackTitle}</span>
                        <span class="feedback-points slds-m-left_small">{brierPointsLabel}</span>
                    </div>
                    <p class="feedback-rationale">{evaluationRationale}</p>
                    <template if:true={citationUrl}>
                        <a href={citationUrl} target="_blank" rel="noopener noreferrer" class="feedback-link slds-m-top_xx-small">
                            Read Governor & Scalability Guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Submit -->
            <div class="controls-panel slds-border_top slds-p-top_small slds-m-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-size_1-of-1 slds-medium-size_2-of-3">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <template if:false={isAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitConfiguration}>
                                Commit Architecture
                            </button>
                        </template>
                        <template if:true={isAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand finish-btn"
                                onclick={handleFinishDrill}>
                                View Calibration Summary
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Summary View -->
        <template if:true={isComplete}>
            <div class="summary-card slds-p-around_large slds-text-align_center">
                <div class="summary-streak-badge slds-m-bottom_medium">
                    🔥 <span class="font-weight-bold">{streakDays}</span> Day Streak Achieved!
                </div>
                <h2 class="slds-text-heading_large font-weight-bold slds-m-bottom_x-small">Architecture Committed!</h2>
                <p class="slds-text-color_weak slds-m-bottom_large">
                    Resource discipline is the hallmark of a Lead Salesforce Architect.
                </p>

                <!-- Stats Grid -->
                <div class="slds-grid slds-wrap stats-grid slds-m-bottom_large">
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{totalAllocatedCost}/{totalBudget}</span>
                        <span class="stat-label">Budget Used</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{earnedPoints}</span>
                        <span class="stat-label">Brier Points</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRestart}>
                    Re-Architect Drill
                </button>
            </div>
        </template>
    </div>
</template>

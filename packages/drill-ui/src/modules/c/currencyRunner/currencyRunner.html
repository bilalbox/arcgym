<template>
    <div class="currency-runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Scenario Header -->
            <div class="scenario-header">
                <div class="scenario-meta">
                    <span class="drill-tag">Currency Drill</span>
                    <span class="drill-domain">{drillDomain}</span>
                </div>
                <h2 class="drill-title">{drillTitle}</h2>
                <p class="scenario-prompt">{scenarioPrompt}</p>
            </div>

            <!-- Sticky Budget Meter (Flush architectural surface) -->
            <div class="meter-sticky-wrapper">
                <c-budget-meter
                    total-budget={totalBudget}
                    used-budget={totalAllocatedCost}
                    unit-label={unitLabel}
                    title={budgetTitle}>
                </c-budget-meter>
            </div>

            <!-- Configuration Categories (0px sharp cards, 1px black hairlines) -->
            <div class="categories-container">
                <template for:each={formattedCategories} for:item="cat">
                    <div key={cat.id} class="category-card">
                        <div class="category-header">
                            <h3 class="category-title">{cat.title}</h3>
                            <p class="category-description">{cat.description}</p>
                        </div>

                        <!-- Option Cards -->
                        <div class="options-grid" role="radiogroup" aria-label={cat.title}>
                            <template for:each={cat.options} for:item="opt">
                                <div
                                    key={opt.id}
                                    class={opt.cardClass}
                                    data-category-id={cat.id}
                                    data-option-id={opt.id}
                                    onclick={handleSelectOption}
                                    role="radio"
                                    aria-checked={opt.isSelected}
                                    tabindex="0"
                                    onkeydown={handleKeyDown}>
                                    <div class="option-header-row">
                                        <div class="option-left">
                                            <span class="option-marker">{opt.letter}</span>
                                            <span class="option-name">{opt.name}</span>
                                        </div>
                                        <span class={opt.costBadgeClass}>{opt.cost} {unitLabel}</span>
                                    </div>
                                    <p class="option-details">{opt.details}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Post-Commit Evaluation Reveal (0px sharp debrief block) -->
            <template if:true={isAnswered}>
                <div class={feedbackClass} role="alert">
                    <div class="feedback-header">
                        <span class="feedback-badge">{feedbackTitle}</span>
                        <span class="feedback-points">{brierPointsLabel}</span>
                    </div>
                    <p class="feedback-rationale">{evaluationRationale}</p>
                    <template if:true={citationUrl}>
                        <a href={citationUrl} target="_blank" rel="noopener noreferrer" class="feedback-link">
                            Read Governor & Scalability Guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Canonical 40px Pill Submit -->
            <div class="controls-panel">
                <div class="controls-row">
                    <div class="controls-gate">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="controls-action">
                        <template if:false={isAnswered}>
                            <button
                                type="button"
                                class="sh-commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitConfiguration}>
                                Commit Architecture
                            </button>
                        </template>
                        <template if:true={isAnswered}>
                            <button
                                type="button"
                                class="sh-finish-btn"
                                onclick={handleFinishDrill}>
                                View Calibration Summary
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Summary View (Cardo Display, 0px cells) -->
        <template if:true={isComplete}>
            <div class="summary-container">
                <div class="summary-streak-badge">
                    🔥 <span class="font-bold">{streakDays}</span> Day Streak Achieved
                </div>
                <h2 class="summary-title">Architecture Committed.</h2>
                <p class="summary-subhead">
                    Resource envelope discipline is the hallmark of a Lead Salesforce Architect.
                </p>

                <!-- Stats Grid (0px Rectilinear Cells) -->
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-number">{totalAllocatedCost}/{totalBudget}</span>
                        <span class="stat-label">Budget Allocated</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number">{earnedPoints}</span>
                        <span class="stat-label">Brier Calibration</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button (40px Pill) -->
                <button type="button" class="sh-restart-btn" onclick={handleRestart}>
                    Re-Architect Drill
                </button>
            </div>
        </template>
    </div>
</template>

<template>
    <div class="scenario-runner-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Scenario Title & Persona Header -->
            <div class="scenario-header slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <span class="drill-tag slds-badge slds-theme_warning">SCENARIO DRILL</span>
                    <span class="step-counter font-weight-bold">MOVE {currentMoveNumber} OF {totalMoves}</span>
                </div>
                <h2 class="slds-text-heading_medium font-weight-bold slds-m-bottom_x-small">{drillTitle}</h2>
                <p class="slds-text-body_small slds-text-color_weak">{drillDomain}</p>
            </div>

            <!-- Sticky Dual-Meter Dashboard -->
            <div class="meters-dashboard slds-box slds-box_small slds-theme_shade slds-m-bottom_medium">
                <div class="slds-grid slds-wrap meters-grid">
                    <!-- Stakeholder Trust Meter -->
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small meter-column">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                            <span class="meter-label font-weight-bold">🤝 Stakeholder Trust</span>
                            <span class="meter-score font-weight-bold">{trustScore}/100</span>
                        </div>
                        <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={trustScore}>
                            <div class="meter-fill meter-fill_trust" style={trustBarStyle}></div>
                        </div>
                        <span class="meter-status-note">{trustStatusNote}</span>
                    </div>

                    <!-- Well-Architected Integrity Meter -->
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_x-small meter-column slds-m-top_small slds-medium-m-top_none">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                            <span class="meter-label font-weight-bold">🛡️ Well-Architected Integrity</span>
                            <span class="meter-score font-weight-bold">{integrityScore}/100</span>
                        </div>
                        <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={integrityScore}>
                            <div class="meter-fill meter-fill_integrity" style={integrityBarStyle}></div>
                        </div>
                        <span class="meter-status-note">{integrityStatusNote}</span>
                    </div>
                </div>
            </div>

            <!-- Stakeholder Dialogue Bubble -->
            <div class="persona-dialogue-card slds-box slds-box_small slds-m-bottom_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <span class="persona-avatar slds-m-right_small">{personaAvatar}</span>
                    <div>
                        <span class="persona-name font-weight-bold">{personaName}</span>
                        <span class="persona-title slds-m-left_x-small slds-text-color_weak">{personaRole}</span>
                    </div>
                </div>
                <div class="speech-bubble">
                    <p class="dialogue-text">"{currentMove.stakeholderDialogue}"</p>
                </div>
            </div>

            <!-- Stance Options Selection -->
            <div class="stances-container slds-m-bottom_medium" role="radiogroup" aria-label="Architectural Stances">
                <template for:each={formattedStances} for:item="stance">
                    <div
                        key={stance.id}
                        class={stance.cardClass}
                        data-id={stance.id}
                        onclick={handleSelectStance}
                        role="radio"
                        aria-checked={stance.isSelected}
                        tabindex="0"
                        onkeydown={handleKeyDown}>
                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                            <span class="stance-marker">{stance.letter}</span>
                            <span class="stance-label font-weight-bold">{stance.label}</span>
                        </div>
                        <template if:true={isMoveAnswered}>
                            <div class="stance-deltas slds-m-top_xx-small">
                                <span class={stance.trustDeltaClass}>Trust: {stance.trustDeltaText}</span>
                                <span class={stance.integrityDeltaClass}>Integrity: {stance.integrityDeltaText}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Move Feedback Reveal -->
            <template if:true={isMoveAnswered}>
                <div class={moveFeedbackClass} role="alert">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="feedback-badge">{moveFeedbackTitle}</span>
                        <span class="feedback-points slds-m-left_small">{movePointsLabel}</span>
                    </div>
                    <p class="stakeholder-reaction slds-m-bottom_xx-small">
                        <span class="font-weight-bold">{personaName}'s Reaction:</span> "{lastReactionText}"
                    </p>
                    <p class="feedback-rationale">{lastRationaleText}</p>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Submit -->
            <div class="controls-panel slds-border_top slds-p-top_small slds-m-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-size_1-of-1 slds-medium-size_2-of-3">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isMoveAnswered}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <template if:false={isMoveAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand commit-btn"
                                disabled={isCommitDisabled}
                                onclick={handleCommitStance}>
                                Commit Stance
                            </button>
                        </template>
                        <template if:true={isMoveAnswered}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand next-btn"
                                onclick={handleNextMove}>
                                {nextButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Debrief: Technical Debt Hangover Card -->
        <template if:true={isComplete}>
            <div class="summary-card slds-p-around_large">
                <div class="slds-text-align_center slds-m-bottom_medium">
                    <div class="summary-streak-badge slds-m-bottom_x-small">
                        🔥 <span class="font-weight-bold">{streakDays}</span> Day Streak Achieved!
                    </div>
                    <h2 class="slds-text-heading_large font-weight-bold">Scenario Debrief & Hangover Report</h2>
                </div>

                <!-- Dual Meter Final State -->
                <div class="final-meters-box slds-box slds-theme_shade slds-m-bottom_medium">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div class="slds-text-align_center slds-size_1-of-2 slds-border_right slds-p-around_small">
                            <span class="final-meter-label">Final Stakeholder Trust</span>
                            <span class="final-meter-value font-weight-bold">{trustScore}/100</span>
                        </div>
                        <div class="slds-text-align_center slds-size_1-of-2 slds-p-around_small">
                            <span class="final-meter-label">Final Platform Integrity</span>
                            <span class="final-meter-value font-weight-bold">{integrityScore}/100</span>
                        </div>
                    </div>
                </div>

                <!-- Technical Debt Hangover Card -->
                <div class={hangoverCardClass}>
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="hangover-badge font-weight-bold">{hangoverTitle}</span>
                    </div>
                    <p class="hangover-timeline font-weight-bold slds-m-bottom_xx-small">🗓️ 6 to 12 Months Post-Deployment:</p>
                    <p class="hangover-body">{hangoverDescription}</p>
                </div>

                <!-- Stats Grid -->
                <div class="slds-grid slds-wrap stats-grid slds-m-bottom_large">
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{correctCount}/{totalMoves}</span>
                        <span class="stat-label">Well-Architected Moves</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Points</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button -->
                <div class="slds-text-align_center">
                    <button type="button" class="slds-button slds-button_neutral" onclick={handleRestart}>
                        Re-Negotiate Scenario
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>

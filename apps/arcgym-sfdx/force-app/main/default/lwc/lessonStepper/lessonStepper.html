<template>
    <div class="lesson-stepper-container">
        <!-- In-Flight Drill View -->
        <template if:false={isComplete}>
            <!-- Lesson Header & Progress Indicator -->
            <div class="lesson-header slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                    <span class="lesson-tag slds-badge slds-theme_success">LESSON: 4-STAGE REFACTOR</span>
                    <span class="stage-indicator font-weight-bold">STAGE {currentStageNumber} OF {totalStages}</span>
                </div>
                <h2 class="slds-text-heading_medium font-weight-bold slds-m-bottom_x-small">{lessonTitle}</h2>
                <p class="lesson-domain slds-text-color_weak slds-m-bottom_small">{lessonDomain}</p>

                <!-- Stage Step Wizard -->
                <div class="stages-wizard slds-grid slds-grid_align-spread slds-m-top_small">
                    <template for:each={formattedStages} for:item="stg">
                        <div key={stg.id} class={stg.wizardStepClass}>
                            <span class="wizard-step-circle">{stg.stepNumber}</span>
                            <span class="wizard-step-title">{stg.title}</span>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Stage Context & Code/Diagram Inspection Box -->
            <div class="inspection-card slds-box slds-box_small slds-theme_shade slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_xx-small">
                    <span class="inspection-badge font-weight-bold">{currentStage.stageName}</span>
                    <span class="slds-badge slds-badge_lightest">{currentStage.focusPillar}</span>
                </div>
                <h3 class="inspection-title font-weight-bold slds-m-bottom_x-small">{currentStage.prompt}</h3>
                
                <template if:true={currentStage.codeSnippet}>
                    <pre class="code-preview slds-m-top_x-small"><code>{currentStage.codeSnippet}</code></pre>
                </template>
            </div>

            <!-- Architectural Options List -->
            <div class="options-container slds-m-bottom_medium" role="radiogroup" aria-label="Refactoring Options">
                <template for:each={formattedOptions} for:item="opt">
                    <div
                        key={opt.id}
                        class={opt.cardClass}
                        data-id={opt.id}
                        onclick={handleSelectOption}
                        role="radio"
                        aria-checked={opt.isSelected}
                        tabindex="0"
                        onkeydown={handleKeyDown}>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <span class="option-marker">{opt.letter}</span>
                            <span class="option-label">{opt.label}</span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- In-Flight Coaching Feedback Callout -->
            <template if:true={showCoachingAlert}>
                <div class="coaching-banner slds-box slds-box_small slds-m-bottom_medium" role="alert">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="coaching-icon">💡</span>
                        <span class="coaching-title font-weight-bold slds-m-left_x-small">Architectural Coaching Note</span>
                    </div>
                    <p class="coaching-text">{coachingMessage}</p>
                    <p class="coaching-subtext slds-m-top_xx-small">Review the constraints above and select another architectural pattern.</p>
                </div>
            </template>

            <!-- Success Stage Feedback Reveal -->
            <template if:true={isStageSuccess}>
                <div class="stage-success-banner slds-box slds-box_small slds-m-bottom_medium" role="alert">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <span class="success-badge font-weight-bold">✓ Target Architectural Pattern Validated</span>
                        <span class="success-points slds-m-left_small">{stagePointsLabel}</span>
                    </div>
                    <p class="success-rationale">{currentStage.successRationale}</p>
                    <template if:true={currentStage.citationUrl}>
                        <a href={currentStage.citationUrl} target="_blank" rel="noopener noreferrer" class="citation-link slds-m-top_xx-small">
                            Read official guidance on architect.salesforce.com ↗
                        </a>
                    </template>
                </div>
            </template>

            <!-- Bottom Controls: Confidence Gate & Submit -->
            <div class="controls-panel slds-border_top slds-p-top_small slds-m-top_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-size_1-of-1 slds-medium-size_2-of-3">
                        <c-confidence-gate
                            selected-confidence={selectedConfidence}
                            disabled={isStageSuccess}
                            onconfidenceselected={handleConfidenceSelected}>
                        </c-confidence-gate>
                    </div>
                    <div class="slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <template if:false={isStageSuccess}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand submit-btn"
                                disabled={isSubmitDisabled}
                                onclick={handleSubmitStageDecision}>
                                Verify Stage
                            </button>
                        </template>
                        <template if:true={isStageSuccess}>
                            <button
                                type="button"
                                class="slds-button slds-button_brand next-stage-btn"
                                onclick={handleNextStage}>
                                {nextStageButtonLabel}
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Completed Refactor Summary View -->
        <template if:true={isComplete}>
            <div class="summary-card slds-p-around_large slds-text-align_center">
                <div class="summary-streak-badge slds-m-bottom_medium">
                    🔥 <span class="font-weight-bold">{streakDays}</span> Day Streak Achieved!
                </div>
                <h2 class="slds-text-heading_large font-weight-bold slds-m-bottom_x-small">Refactoring Masterclass Complete!</h2>
                <p class="slds-text-color_weak slds-m-bottom_large">
                    You systematically diagnosed root causes, identified decoupled Well-Architected target patterns, governed migration, and established production observability.
                </p>

                <!-- Stats Grid -->
                <div class="slds-grid slds-wrap stats-grid slds-m-bottom_large">
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">4/4 Stages</span>
                        <span class="stat-label">Refactor Phases</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number">{totalBrierPoints}</span>
                        <span class="stat-label">Brier Points</span>
                    </div>
                    <div class="stat-box slds-size_1-of-3">
                        <span class="stat-number stat-quadrant">{quadrantLabel}</span>
                        <span class="stat-label">Metacognition</span>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRestart}>
                    Practice Another Refactor Drill
                </button>
            </div>
        </template>
    </div>
</template>

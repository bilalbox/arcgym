name = "arcgym"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "DRILL_KV"
id = "c1f903c9221b40c086115dd7fc7f43d7"

[[d1_databases]]
binding = "DB"
database_name = "arcgym-d1"
database_id = "88b26db3-86e8-44c1-90be-8853abc898f6"
migrations_dir = "migrations"

# Workers AI — Troubleshooting free-text cause grading (`@cf/baai/bge-reranker-base`).
[ai]
binding = "AI"

# Secrets (never commit values — use Wrangler secrets or .dev.vars locally):
#   ARCGYM_HMAC_SECRET       — publish-drill webhook HMAC
#   ARCGYM_ADMIN_KEY         — X-ArcGym-Admin-Key for /api/admin/*
#   ARCGYM_VOTE_HMAC_SECRET  — vote-dedup HMAC (IP×day×drill)
#   GOOGLE_CLIENT_ID         — Google OAuth 2.0 Client ID
#   GOOGLE_CLIENT_SECRET     — Google OAuth 2.0 Client Secret
#   GITHUB_CLIENT_ID         — GitHub OAuth 2.0 Client ID
#   GITHUB_CLIENT_SECRET     — GitHub OAuth 2.0 Client Secret
#   SESSION_SECRET           — HMAC-SHA256 secret for signing arcgym_session cookies (min 32 chars)
#   LEARNER_PEPPER           — Private salt for HMAC-SHA256 pseudonymous learner IDs (min 32 chars)
#
#   pnpm exec wrangler pages secret put ARCGYM_HMAC_SECRET --project-name=arcgym
#   pnpm exec wrangler pages secret put ARCGYM_ADMIN_KEY --project-name=arcgym
#   pnpm exec wrangler pages secret put ARCGYM_VOTE_HMAC_SECRET --project-name=arcgym
#   pnpm exec wrangler pages secret put GOOGLE_CLIENT_ID --project-name=arcgym
#   pnpm exec wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name=arcgym
#   pnpm exec wrangler pages secret put GITHUB_CLIENT_ID --project-name=arcgym
#   pnpm exec wrangler pages secret put GITHUB_CLIENT_SECRET --project-name=arcgym
#   pnpm exec wrangler pages secret put SESSION_SECRET --project-name=arcgym
#   pnpm exec wrangler pages secret put LEARNER_PEPPER --project-name=arcgym
#
# Local Pages Functions: copy apps/arcgym-web/.dev.vars.example → apps/arcgym-web/.dev.vars

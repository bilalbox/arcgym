<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Data Cloud One Hub-and-Spoke Topology</title>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Home Org Container (Central Left) -->
  <g transform="translate(30, 20)">
    <rect width="270" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="28" rx="10" fill="#f1f5f9"/>
    <text x="135" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Data Cloud Home Org</text>
    <text x="135" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Harmonized DMOs &amp; Identity Engine</text>
    <text x="135" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Calculated Insights &amp; Data Spaces</text>
    <rect x="25" y="84" width="220" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Digital Wallet: Centralized Credit Allocation</text>
  </g>

  <!-- Connectors from Home to Companions -->
  <path d="M 300 50 C 370 50, 410 38, 470 38" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)" fill="none"/>
  <path d="M 300 80 L 470 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)" fill="none"/>
  <path d="M 300 110 C 370 110, 410 122, 470 122" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)" fill="none"/>

  <!-- Middleware Label -->
  <rect x="330" y="68" width="110" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="385" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#475569">Data Cloud One</text>

  <!-- Companion Org 1: Sales -->
  <g transform="translate(470, 16)">
    <rect width="300" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Sales CRM Companion</text>
    <text x="286" y="23" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Unified Account Fields</text>
  </g>

  <!-- Companion Org 2: Service -->
  <g transform="translate(470, 61)">
    <rect width="300" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Service CRM Companion</text>
    <text x="286" y="23" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Agentforce Reasoning</text>
  </g>

  <!-- Companion Org 3: Commerce -->
  <g transform="translate(470, 106)">
    <rect width="300" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Commerce Companion</text>
    <text x="286" y="23" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Real-Time Personalization</text>
  </g>
</svg>

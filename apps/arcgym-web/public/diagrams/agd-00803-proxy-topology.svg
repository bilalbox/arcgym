<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Edge Anonymization Proxy Ingestion Topology</title>
  <defs>
    <marker id="arrow-neutral-proxy" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- EU CRM Source -->
  <g transform="translate(30, 25)">
    <rect width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="190" height="26" rx="10" fill="#f1f5f9"/>
    <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">EU CRM Org</text>
    <text x="95" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Raw Customer Records</text>
    <text x="95" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Name, Email, Phone, Address</text>
  </g>

  <path d="M 220 80 L 280 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-proxy)" fill="none"/>

  <!-- Edge Scrubbing Proxy -->
  <g transform="translate(280, 25)">
    <rect width="230" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="230" height="26" rx="10" fill="#f1f5f9"/>
    <text x="115" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">On-Premises Scrubbing Proxy</text>
    <text x="115" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Tokenizes Identifier Fields</text>
    <rect x="15" y="70" width="200" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="115" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Irreversible Hash Algorithms</text>
  </g>

  <path d="M 510 80 L 570 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-proxy)" fill="none"/>

  <!-- US Data Cloud -->
  <g transform="translate(570, 25)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="200" height="26" rx="10" fill="#f1f5f9"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Global Data Cloud</text>
    <text x="100" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Identity Resolution Engine</text>
    <text x="100" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Matching on Anonymized Strings</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>External Table Schema Validation in Batch Data Transform</title>
  <defs>
    <marker id="arrow-neutral-bdt3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- External Table Definition -->
  <g transform="translate(30, 20)">
    <rect width="210" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="210" height="26" rx="10" fill="#f1f5f9"/>
    <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Snowflake Lakehouse</text>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">External Table Object</text>
    <text x="105" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Federated Table Metadata</text>
    <rect x="15" y="85" width="180" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Source Object Registration</text>
  </g>

  <!-- Schema Link Path -->
  <path d="M 240 80 L 300 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-bdt3)" fill="none"/>
  <rect x="245" y="50" width="50" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="270" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Federate</text>

  <!-- Data Cloud Lake Schema -->
  <g transform="translate(300, 20)">
    <rect width="220" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="220" height="26" rx="10" fill="#f1f5f9"/>
    <text x="110" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Data Cloud Catalog</text>
    <text x="110" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Federated Lake Object</text>
    <text x="110" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Direct Schema Mapping</text>
    <rect x="15" y="85" width="190" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Supported Pipeline Input</text>
  </g>

  <!-- Pipeline Input Path -->
  <path d="M 520 80 L 570 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-bdt3)" fill="none"/>
  <rect x="525" y="50" width="42" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="546" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Bind</text>

  <!-- BDT Canvas -->
  <g transform="translate(570, 20)">
    <rect width="200" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="200" height="26" rx="10" fill="#f1f5f9"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Batch Data Transform</text>
    <text x="100" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Pipeline Input Node</text>
    <text x="100" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Verified Graph Integration</text>
    <rect x="15" y="85" width="170" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Valid Schema Execution</text>
  </g>
</svg>

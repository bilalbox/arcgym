<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Zero Copy File Federation with S3 Iceberg Catalog Topology</title>
  <defs>
    <marker id="arrow-neutral-ice" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- AWS S3 Object Store in us-east-1 -->
  <g transform="translate(30, 20)">
    <rect width="230" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="230" height="26" rx="10" fill="#f1f5f9"/>
    <text x="115" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Amazon S3 Lake [us-east-1]</text>
    <text x="115" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Apache Iceberg / Parquet</text>
    <text x="115" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">400 TB Diagnostic Telemetry</text>
    <rect x="20" y="85" width="190" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Partitioned Columnar Format</text>
  </g>

  <!-- In-Place Read Pointer -->
  <path d="M 260 80 L 330 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-ice)" fill="none"/>
  <rect x="268" y="50" width="55" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="295" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Zero Copy</text>

  <!-- Data Cloud Zero Copy File Federation -->
  <g transform="translate(330, 20)">
    <rect width="230" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="230" height="26" rx="10" fill="#f1f5f9"/>
    <text x="115" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Data Cloud [us-east-1]</text>
    <text x="115" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">File Federation Catalog</text>
    <text x="115" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">In-Place Reads via Iceberg Metadata</text>
    <rect x="15" y="85" width="200" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Same-Region Network Placement</text>
  </g>

  <!-- Direct Consumption Path -->
  <path d="M 560 80 L 610 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-ice)" fill="none"/>

  <!-- AI & Insights Layer -->
  <g transform="translate(610, 25)">
    <rect width="160" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="26" rx="10" fill="#f1f5f9"/>
    <text x="80" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Agentforce &amp; Insights</text>
    <text x="80" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Anomaly Scoring</text>
    <text x="80" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Direct Query Grounding</text>
    <rect x="15" y="82" width="130" height="20" rx="4" fill="#f8fafc"/>
    <text x="80" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Operational Workflows</text>
  </g>
</svg>

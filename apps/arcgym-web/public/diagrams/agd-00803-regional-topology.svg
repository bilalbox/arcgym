<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Regional Data Cloud Clusters with Zero Copy Data Sharing</title>
  <defs>
    <marker id="arrow-neutral-reg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- European Region Boundary -->
  <g transform="translate(25, 15)">
    <rect width="335" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="335" height="24" rx="10" fill="#f1f5f9"/>
    <text x="167" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">European Union Boundary</text>

    <!-- EU CRM Org -->
    <rect x="15" y="38" width="130" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">EU CRM Org</text>
    <text x="80" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Customer PII</text>

    <path d="M 145 63 L 180 63" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-reg)" fill="none"/>

    <!-- EU Data Cloud Home -->
    <rect x="185" y="38" width="135" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="252" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">EU Data Cloud</text>
    <text x="252" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Regional Storage</text>
    <text x="252" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Local Identity Engine</text>
  </g>

  <!-- Cross-Region Zero Copy Sharing Link -->
  <path d="M 360 80 L 440 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-reg)" fill="none"/>
  <path d="M 440 70 L 360 70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-reg)" fill="none"/>
  <rect x="345" y="38" width="110" height="28" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0f172a">Zero Copy</text>
  <text x="400" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Data Sharing</text>

  <!-- North America Region Boundary -->
  <g transform="translate(440, 15)">
    <rect width="335" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="335" height="24" rx="10" fill="#f1f5f9"/>
    <text x="167" y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">North America Boundary</text>

    <!-- NA Data Cloud Home -->
    <rect x="15" y="38" width="140" height="75" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">NA Data Cloud</text>
    <text x="85" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Shared Global Models</text>
    <text x="85" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Aggregated LTV</text>

    <path d="M 155 63 L 190 63" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-reg)" fill="none"/>

    <!-- NA CRM Org -->
    <rect x="195" y="38" width="125" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="257" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">NA CRM Org</text>
    <text x="257" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Global Executive BI</text>
  </g>
</svg>

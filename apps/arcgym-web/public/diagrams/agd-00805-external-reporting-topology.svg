<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Salesforce Connect External Objects Reporting Topology</title>
  <defs>
    <marker id="arrow-neutral-ext" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ERP Source -->
  <g transform="translate(30, 25)">
    <rect width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="190" height="26" rx="10" fill="#f1f5f9"/>
    <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">SAP ERP Source</text>
    <text x="95" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">50M Shipment Rows</text>
    <text x="95" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">OData 4.0 Producer Endpoint</text>
    <rect x="15" y="82" width="160" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="95" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Synchronous HTTP Service</text>
  </g>

  <!-- Analytical Scan Callout -->
  <path d="M 220 80 L 460 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-ext)" fill="none"/>
  <rect x="255" y="50" width="170" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="340" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#475569">OData Query Callouts</text>

  <!-- Salesforce Reporting / CRM Analytics -->
  <g transform="translate(470, 20)">
    <rect width="300" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="300" height="26" rx="10" fill="#f1f5f9"/>
    <text x="150" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Salesforce Reports &amp; Dashboards</text>
    <text x="150" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">External Object: Shipment__x</text>
    <text x="150" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Cross-Table Rollups &amp; Multi-Million Row Grouping</text>
    <rect x="20" y="85" width="260" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Direct Real-Time OData Paging via Adapter</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Identity Resolution Engine Applied to Raw Transactions Topology</title>
  <defs>
    <marker id="arrow-neutral-cv3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Raw Transactions Source -->
  <g transform="translate(30, 20)">
    <rect width="210" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="210" height="26" rx="10" fill="#f1f5f9"/>
    <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Raw Transactions</text>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Snowflake Lakehouse</text>
    <text x="105" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">140 Raw Fields &amp; Duplicates</text>
    <rect x="15" y="85" width="180" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Transaction Record Grain</text>
  </g>

  <!-- Feed Path -->
  <path d="M 240 80 L 295 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-cv3)" fill="none"/>
  <rect x="245" y="50" width="46" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="268" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Feed</text>

  <!-- Identity Resolution Rules -->
  <g transform="translate(295, 20)">
    <rect width="230" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="230" height="26" rx="10" fill="#f1f5f9"/>
    <text x="115" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Identity Resolution</text>
    <text x="115" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Match Rules Engine</text>
    <text x="115" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Party Identification &amp; Linking</text>
    <rect x="15" y="85" width="200" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Customer Profile Matching</text>
  </g>

  <!-- Unify Path -->
  <path d="M 525 80 L 575 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-cv3)" fill="none"/>
  <rect x="527" y="50" width="46" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Unify</text>

  <!-- Unified Individual Entity -->
  <g transform="translate(575, 20)">
    <rect width="195" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="195" height="26" rx="10" fill="#f1f5f9"/>
    <text x="97" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Unified Profiles</text>
    <text x="97" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Unified Individual DMO</text>
    <text x="97" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Person Identity Master</text>
    <rect x="15" y="85" width="165" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="97" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Party Level Resolution Only</text>
  </g>
</svg>

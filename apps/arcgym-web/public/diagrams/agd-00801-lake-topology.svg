le, #0f172a)" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Raw DLOs</text><text x="75" y="90.5" fill="var(--diagram-arcgym-card-subtitle, #64748b)" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">CRM &amp; Web Ingest</text></g><g class="diagram-node" data-node-id="bypass" opacity="0.6"><rect class="diagram-node-body" x="270" y="20" width="260" height="54" rx="10" fill="var(--diagram-arcgym-card-bg, #ffffff)" stroke="var(--diagram-arcgym-card-border, #cbd5e1)" stroke-width="1.5" stroke-dasharray="5 4"></rect><text x="400" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="var(--diagram-arcgym-card-title, #0f172a)">Data Cloud Standard Layer</text><text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="var(--diagram-arcgym-card-subtitle, #64748b)">Unmapped DMOs &amp; Identity Engine</text></g><g class="diagram-node" data-node-id="mc" data-layout-role="node"><rect class="diagram-node-mask" x="665" y="53" width="110" height="54" rx="10" fill="var(--diagram-svg-background)" data-layout-role="node-mask"></rect><rect class="diagram-node-body" x="665" y="53" width="110" height="54" rx="10" fill="color-mix(in oklch, var(--diagram-arcgym-family-neutral, var(--diagram-arcgym-line, #64748b)) 6%, var(--diagram-arcgym-card-bg, #ffffff))" stroke="var(--diagram-arcgym-card-border, #cbd5e1)" stroke-width="1.5" data-layout-role="node-body"></rect><text x="720" y="77.5" fill="var(--diagram-arcgym-card-title, #0f172a)" font-size="10" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Marketing Cloud</text><text x="720" y="90.5" fill="var(--diagram-arcgym-card-subtitle, #64748b)" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Engagement Channel</text></g><g class="diagram-edge" data-edge-from="dlo" data-edge-to="mc" data-qa-allow="path-detour"><path class="diagram-edge-line" d="M
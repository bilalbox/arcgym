<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>S3 Continuous Data Stream Ingestion Topology</title>
  <defs>
    <marker id="arrow-neutral-ingest" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- S3 Bucket Source -->
  <g transform="translate(30, 25)">
    <rect width="210" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="210" height="26" rx="10" fill="#f1f5f9"/>
    <text x="105" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Amazon S3 Source</text>
    <text x="105" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">400 TB Telemetry Logs</text>
    <text x="105" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Primary File Repository</text>
    <rect x="20" y="82" width="170" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="105" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Raw S3 Bucket Storage</text>
  </g>

  <!-- Ingestion Stream -->
  <path d="M 240 80 L 490 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-neutral-ingest)" fill="none"/>
  <rect x="285" y="50" width="180" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="375" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#475569">S3 Data Stream Ingest Pipe</text>

  <!-- Native Data Cloud Ingest Lake -->
  <g transform="translate(500, 20)">
    <rect width="270" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="270" height="26" rx="10" fill="#f1f5f9"/>
    <text x="135" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Native Data Cloud Storage</text>
    <text x="135" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Data Lake Objects (DLOs)</text>
    <text x="135" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Continuous Batch File Replication</text>
    <rect x="20" y="85" width="230" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Internal Lakehouse Storage Model</text>
  </g>
</svg>

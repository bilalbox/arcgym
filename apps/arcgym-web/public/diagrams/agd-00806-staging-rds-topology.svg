<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Intermediate Relational Staging Database Topology</title>
  <defs>
    <marker id="arrow-neutral-stage" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- S3 Bucket -->
  <g transform="translate(30, 25)">
    <rect width="180" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="26" rx="10" fill="#f1f5f9"/>
    <text x="90" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Amazon S3 Lake</text>
    <text x="90" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">400 TB Telemetry</text>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Parquet Files</text>
    <rect x="15" y="82" width="150" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Source Object Store</text>
  </g>

  <!-- Pipe 1: S3 to Staging DB -->
  <path d="M 210 80 L 270 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-stage)" fill="none"/>

  <!-- Relational Staging Database -->
  <g transform="translate(270, 20)">
    <rect width="250" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="26" rx="10" fill="#f1f5f9"/>
    <text x="125" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Intermediate Staging Database</text>
    <text x="125" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Relational PostgreSQL Tables</text>
    <text x="125" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">SQL Aggregations &amp; Staging Views</text>
    <rect x="15" y="85" width="220" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="125" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Intermediary Relational Compute</text>
  </g>

  <!-- Pipe 2: Reverse ETL to Data Cloud -->
  <path d="M 520 80 L 570 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-stage)" fill="none"/>

  <!-- Data Cloud Destination -->
  <g transform="translate(570, 25)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="200" height="26" rx="10" fill="#f1f5f9"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Data Cloud Platform</text>
    <text x="100" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">Ingestion Data Streams</text>
    <text x="100" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Reverse ETL Push Jobs</text>
    <rect x="15" y="82" width="170" height="20" rx="4" fill="#f8fafc"/>
    <text x="100" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Target Stream Objects</text>
  </g>
</svg>

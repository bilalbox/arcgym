<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Accelerated Query Caching Topology</title>
  <defs>
    <marker id="arrow-neutral-c3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Snowflake Lakehouse -->
  <g transform="translate(30, 25)">
    <rect width="200" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="200" height="26" rx="10" fill="#f1f5f9"/>
    <text x="100" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Snowflake Lakehouse</text>
    <text x="100" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">120M Order Records</text>
    <rect x="20" y="70" width="160" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">External Table Storage</text>
  </g>

  <!-- Scheduled Refresh Line -->
  <path d="M 230 80 L 290 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-c3)" fill="none"/>
  <text x="260" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Periodic</text>
  <text x="260" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Refresh</text>

  <!-- Data Cloud Accelerated Query Cache -->
  <g transform="translate(290, 20)">
    <rect width="230" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="230" height="28" rx="10" fill="#f1f5f9"/>
    <text x="115" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Data Cloud Zero Copy</text>
    <text x="115" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Accelerated Query Cache</text>
    <text x="115" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Materialized Cache Layer</text>
    <rect x="15" y="85" width="200" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="115" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Configured Cache TTL</text>
  </g>

  <!-- Sub-Second Read Line -->
  <path d="M 520 80 L 580 80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-c3)" fill="none"/>
  <text x="550" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Cached</text>
  <text x="550" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Queries</text>

  <!-- High-QPS Consumers -->
  <g transform="translate(580, 25)">
    <rect width="190" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="190" height="26" rx="10" fill="#f1f5f9"/>
    <text x="95" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">High-QPS Traffic</text>
    <text x="95" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">CRM Users &amp; Agentforce</text>
    <text x="95" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">600+ Requests / Minute</text>
    <rect x="15" y="82" width="160" height="20" rx="4" fill="#f8fafc"/>
    <text x="95" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Operational Reads</text>
  </g>
</svg>

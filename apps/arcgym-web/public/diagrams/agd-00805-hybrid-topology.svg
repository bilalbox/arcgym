<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Hybrid Data Virtualization Topology</title>
  <defs>
    <marker id="arrow-neutral-hyb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ERP / SAP Source -->
  <g transform="translate(30, 25)">
    <rect width="180" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="26" rx="10" fill="#f1f5f9"/>
    <text x="90" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">SAP ERP Source</text>
    <text x="90" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0f172a">50M Shipment Rows</text>
    <text x="90" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">OData 4.0 &amp; Lake Export</text>
    <rect x="15" y="82" width="150" height="20" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="90" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#475569">Operational Enterprise Data</text>
  </g>

  <!-- Path 1: Top Branch to Salesforce Connect -->
  <path d="M 210 55 C 290 55, 330 40, 400 40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-hyb)" fill="none"/>
  <rect x="245" y="28" width="135" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">OData 4.0 Point Lookup</text>

  <!-- Salesforce Connect in CRM -->
  <g transform="translate(410, 15)">
    <rect width="360" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Salesforce Connect External Objects</text>
    <text x="14" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Interactive Account Record Detail &amp; Related List</text>
    <text x="14" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Server-driven pagination | Sub-second detail inspection</text>
  </g>

  <!-- Path 2: Bottom Branch to Data Cloud Zero Copy -->
  <path d="M 210 105 C 290 105, 330 115, 400 115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral-hyb)" fill="none"/>
  <rect x="245" y="105" width="135" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#475569">Zero Copy Federation</text>

  <!-- Data Cloud Analytical Engine -->
  <g transform="translate(410, 85)">
    <rect width="360" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Data Cloud Zero Copy Engine</text>
    <text x="14" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#475569">Calculated Insights &amp; Agentforce Propensity Scoring</text>
    <text x="14" y="50" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">Multi-million row aggregation | In-lake analytical queries</text>
  </g>
</svg>

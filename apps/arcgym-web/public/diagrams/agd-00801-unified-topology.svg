<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <title>Unified Individual Segment Activation Topology</title>
  <defs>
    <marker id="arrow-unified" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="800" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Flow Lines -->
  <path d="M 125 80 L 165 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-unified)" fill="none"/>
  <path d="M 285 80 L 325 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-unified)" fill="none"/>
  <path d="M 455 80 L 495 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-unified)" fill="none"/>
  <path d="M 625 80 L 665 80" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-unified)" fill="none"/>

  <!-- Stage 1: DLOs -->
  <g transform="translate(25, 53)">
    <rect width="100" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Raw DLOs</text>
    <text x="50" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">CRM &amp; Web Ingest</text>
  </g>

  <!-- Stage 2: Contact DMO -->
  <g transform="translate(165, 53)">
    <rect width="120" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Contact DMO</text>
    <text x="60" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Data Model Mapping</text>
  </g>

  <!-- Stage 3: Identity Resolution -->
  <g transform="translate(325, 53)">
    <rect width="130" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Identity Resolution</text>
    <text x="65" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Rules &amp; Reconciliation</text>
  </g>

  <!-- Stage 4: Unified Individual & Segment -->
  <g transform="translate(495, 53)">
    <rect width="130" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Unified Segment</text>
    <text x="65" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Unified Individual DMO</text>
  </g>

  <!-- Stage 5: Marketing Cloud -->
  <g transform="translate(665, 53)">
    <rect width="110" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="55" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Marketing Cloud</text>
    <text x="55" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Engagement Channel</text>
  </g>
</svg>
